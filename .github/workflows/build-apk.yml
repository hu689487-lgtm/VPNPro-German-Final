name: Build VPN Pro German APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fix Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $ANDROID_HOME/licenses/android-sdk-license
      - name: Create REAL ADS App
        run: |
          rm -rf app .gradle build
          mkdir -p app/src/main/java/com/vpnpro/datenschutz
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vpnpro.datenschutz'
            compileSdk 34
            defaultConfig {
              applicationId "com.vpnpro.datenschutz"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.gms:play-services-ads:22.6.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="VPN Pro">
              <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3091902439302727~7328733128"/>
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/vpnpro/datenschutz/MainActivity.java << 'EOF'
          package com.vpnpro.datenschutz;
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.*;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              setContentView(R.layout.activity_main);
              MobileAds.initialize(this, s->{});
              AdView ad=findViewById(R.id.adView);
              ad.setAdUnitId("ca-app-pub-3091902439302727/7227204506");
              ad.loadAd(new AdRequest.Builder().build());
            }
          }
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#0A1931" android:layout_width="match_parent" android:layout_height="match_parent">
            <TextView android:text="VPN Pro - Sicherer Datenschutz" android:textColor="#00FF88" android:textSize="22sp" android:textStyle="bold" android:gravity="center" android:layout_margin="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <Button android:text="PRO VERBINDEN" android:backgroundTint="#00FF88" android:textColor="#0A1931" android:layout_margin="20dp" android:layout_width="match_parent" android:layout_height="64dp"/>
            <com.google.android.gms.ads.AdView android:id="@+id/adView" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF
          echo '<resources><string name="app_name">VPN Pro</string></resources>' > app/src/main/res/values/strings.xml
      - name: Build APK - REAL ADS
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNPro-German-REAL-ADS-APK
          path: app/build/outputs/apk/debug/*.apk
