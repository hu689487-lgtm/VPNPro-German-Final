name: Build VPN Pro German APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build Project via Python
        run: |
          python3 << 'PY'
          import os, pathlib
          os.makedirs("app/src/main/java/com/vpnpro/datenschutz", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          pathlib.Path("settings.gradle").write_text("include ':app'")
          pathlib.Path("app/build.gradle").write_text("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vpnpro.datenschutz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vpnpro.datenschutz"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:22.6.0'
          }
          """)
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="VPN Pro">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3091902439302727~7328733128"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          pathlib.Path("app/src/main/java/com/vpnpro/datenschutz/MainActivity.java").write_text("""
          package com.vpnpro.datenschutz;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.*;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  MobileAds.initialize(this, s->{});
                  AdView ad = findViewById(R.id.adView);
                  ad.setAdUnitId("ca-app-pub-3091902439302727/7227204506");
                  ad.loadAd(new AdRequest.Builder().build());
              }
          }
          """)
          pathlib.Path("app/src/main/res/layout/activity_main.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:background="#0A1931"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <TextView android:text="VPN Pro - Sicherer Datenschutz Schutz"
                  android:textColor="#00FF88" android:textSize="22sp" android:textStyle="bold"
                  android:gravity="center" android:layout_margin="24dp"
                  android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <Button android:text="PRO VERBINDEN" android:backgroundTint="#00FF88"
                  android:textColor="#0A1931" android:layout_margin="20dp"
                  android:layout_width="match_parent" android:layout_height="64dp"/>
              <com.google.android.gms.ads.AdView android:id="@+id/adView"
                  android:layout_width="match_parent" android:layout_height="wrap_content"/>
          </LinearLayout>
          """)
          pathlib.Path("app/src/main/res/values/strings.xml").write_text("<resources><string name=\"app_name\">VPN Pro</string></resources>")
          print("All files created with REAL AdMob IDs!")
          PY
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNPro-German-Real-Ads-APK
          path: app/build/outputs/apk/debug/*.apk
