name: Build VPN Pro German APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Project with REAL ADS
        run: |
          python3 << 'PY'
          import os, pathlib
          os.makedirs("app/src/main/java/com/vpnpro/datenschutz", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          pathlib.Path("settings.gradle").write_text("include ':app'")
          pathlib.Path("app/build.gradle").write_text("plugins { id 'com.android.application' }\nandroid { namespace 'com.vpnpro.datenschutz'\n compileSdk 34\n defaultConfig { applicationId \"com.vpnpro.datenschutz\"; minSdk 24; targetSdk 34; versionCode 1; versionName \"1.0\" }\n buildTypes { release { minifyEnabled false } }\n}\ndependencies {\n implementation 'androidx.appcompat:appcompat:1.6.1'\n implementation 'com.google.android.gms:play-services-ads:22.6.0'\n}")
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="VPN Pro"><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3091902439302727~7328733128"/><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          pathlib.Path("app/src/main/java/com/vpnpro/datenschutz/MainActivity.java").write_text('package com.vpnpro.datenschutz;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\nimport com.google.android.gms.ads.*;\npublic class MainActivity extends AppCompatActivity {\n protected void onCreate(Bundle b){\n  super.onCreate(b);\n  setContentView(R.layout.activity_main);\n  MobileAds.initialize(this, s->{});\n  AdView ad=findViewById(R.id.adView);\n  ad.setAdUnitId("ca-app-pub-3091902439302727/7227204506");\n  ad.loadAd(new AdRequest.Builder().build());\n }\n}')
          pathlib.Path("app/src/main/res/layout/activity_main.xml").write_text('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#0A1931" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="VPN Pro - Sicherer Datenschutz" android:textColor="#00FF88" android:textSize="22sp" android:textStyle="bold" android:gravity="center" android:layout_margin="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:text="PRO VERBINDEN" android:backgroundTint="#00FF88" android:textColor="#0A1931" android:layout_margin="20dp" android:layout_width="match_parent" android:layout_height="64dp"/><com.google.android.gms.ads.AdView android:id="@+id/adView" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>')
          pathlib.Path("app/src/main/res/values/strings.xml").write_text('<resources><string name="app_name">VPN Pro</string></resources>')
          PY
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload REAL ADS APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNPro-German-Real-Ads-APK
          path: app/build/outputs/apk/debug/*.apk
