name: Build VPN Pro German APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Create Project Files
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/vpnpro/datenschutz
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vpnpro.datenschutz'
            compileSdk 33
            defaultConfig {
              applicationId "com.vpnpro.datenschutz"
              minSdk 24
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.gms:play-services-ads:22.6.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="VPN Pro"><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3091902439302727~7328733128"/><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/vpnpro/datenschutz/MainActivity.java << 'EOF'
          package com.vpnpro.datenschutz; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import com.google.android.gms.ads.*; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); MobileAds.initialize(this, o->{}); AdView ad=findViewById(R.id.adView); ad.setAdUnitId("ca-app-pub-3091902439302727/7227204506"); ad.loadAd(new AdRequest.Builder().build()); } }
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#0A1931" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="VPN Pro German REAL ADS" android:textColor="#00FF88" android:textSize="20sp" android:gravity="center" android:layout_margin="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/><com.google.android.gms.ads.AdView android:id="@+id/adView" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">VPN Pro</string></resources>
          EOF

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNPro-German-REAL-ADS-APK
          path: app/build/outputs/apk/debug/*.apk
