name: Final Build
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Create minimal Android project
        run: |
          python3 - <<'PY'
          import pathlib, textwrap

          root = pathlib.Path(".")

          # Root settings.gradle
          root.joinpath("settings.gradle").write_text(
              textwrap.dedent("""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              include ':app'
              """)
          )

          root.joinpath("build.gradle").write_text(
              textwrap.dedent("""
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.5.2'
                  }
              }
              """)
          )

          root.joinpath("gradle.properties").write_text(
              textwrap.dedent("""
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              android.enableJetifier=true
              """)
          )

          app_dir = root / "app"
          (app_dir / "src/main/java/com/vpnpro/datenschutz").mkdir(parents=True, exist_ok=True)
          (app_dir / "src/main/res/layout").mkdir(parents=True, exist_ok=True)
          (app_dir / "src/main/res/values").mkdir(parents=True, exist_ok=True)

          app_dir.joinpath("build.gradle").write_text(
              textwrap.dedent("""
              plugins {
                  id 'com.android.application'
              }

              android {
                  namespace 'com.vpnpro.datenschutz'
                  compileSdk 33

                  defaultConfig {
                      applicationId "com.vpnpro.datenschutz"
                      minSdk 24
                      targetSdk 33
                      versionCode 1
                      versionName "1.0"
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }

              dependencies {
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'com.google.android.gms:play-services-ads:22.6.0'
              }
              """)
          )

          app_dir.joinpath("src/main/AndroidManifest.xml").write_text(
              textwrap.dedent("""
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <application android:label="VPN Pro">
                      <meta-data
                          android:name="com.google.android.gms.ads.APPLICATION_ID"
                          android:value="ca-app-pub-3091902439302727~7328733128" />
                      <activity
                          android:name=".MainActivity"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
              """)
          )

          app_dir.joinpath("src/main/java/com/vpnpro/datenschutz/MainActivity.java").write_text(
              textwrap.dedent("""
              package com.vpnpro.datenschutz;

              import android.os.Bundle;
              import androidx.appcompat.app.AppCompatActivity;
              import com.google.android.gms.ads.AdRequest;
              import com.google.android.gms.ads.AdView;
              import com.google.android.gms.ads.MobileAds;

              public class MainActivity extends AppCompatActivity {
                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      setContentView(R.layout.activity_main);

                      MobileAds.initialize(this, initializationStatus -> {});

                      AdView adView = findViewById(R.id.adView);
                      adView.setAdUnitId("ca-app-pub-3091902439302727/7227204506");
                      adView.loadAd(new AdRequest.Builder().build());
                  }
              }
              """)
          )

          app_dir.joinpath("src/main/res/layout/activity_main.xml").write_text(
              textwrap.dedent("""
              <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:orientation="vertical"
                  android:background="#0A1931"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <TextView
                      android:text="VPN Pro German REAL ADS"
                      android:textColor="#00FF88"
                      android:textSize="22sp"
                      android:gravity="center"
                      android:layout_margin="24dp"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content" />

                  <com.google.android.gms.ads.AdView
                      android:id="@+id/adView"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content" />
              </LinearLayout>
              """)
          )

          app_dir.joinpath("src/main/res/values/strings.xml").write_text(
              textwrap.dedent("""
              <resources>
                  <string name="app_name">VPN Pro</string>
              </resources>
              """)
          )
          PY

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
